name: packaging

# Holds every pull request to what the release workflow will need, so a
# dispatched release does not find out first (docs/publishing.md):
#   release-tools  tools/release.py's tests, and every fragment valid
#   changeset      a change to the engine's build or headers ships a
#                  .changes/unreleased/ fragment, or carries `no-changelog`
#   package        install the package and build a consumer against it,
#                  on every platform a release ships
#   scaffold       `ge new` writes a game repo and ge alone grows it (use, add
#                  system, lab, test), passes `ge check` against this tree, and
#                  plays it (sim, replay, play, state, diverge)
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make release-check

  changeset:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A shipped change carries a fragment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          SHIPPED=$(echo "$CHANGED" | grep -E '^(engine/|cmake/|consumer-skills/|scaffold/|templates/|CMakeLists\.txt$)' || true)
          FRAGMENTS=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- '.changes/unreleased/*.md' | grep -v README.md || true)
          if [ -n "$SHIPPED" ] && [ -z "$FRAGMENTS" ]; then
            echo "::error::This PR changes what a release ships but adds no .changes/unreleased/ fragment."
            echo "Add one (see .changes/unreleased/README.md), or label the PR no-changelog if no consumer can notice."
            echo "$SHIPPED"
            exit 1
          fi

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Build, install, consume
        run: |
          ROOT=$(cygpath -m "$PWD" 2>/dev/null || pwd)  # a path CMake reads on Windows too
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGE_PLATFORM=OFF -DGE_GPU=OFF
          # A bounded job count: an unbounded one under Make runs every source at once and the
          # runner runs out of memory.
          cmake --build build --config Release --parallel 4
          cmake --install build --config Release --prefix stage
          cmake -S tests/package/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$ROOT/stage"
          cmake --build build-consumer --config Release
          ctest --test-dir build-consumer -C Release --output-on-failure
          stage/bin/ge version

  scaffold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ge alone grows a new repo, then holds it to its whole gate, against this tree
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGE_PLATFORM=OFF -DGE_GPU=OFF
          cmake --build build --target ge
          G="$GITHUB_WORKSPACE/build/ge"
          "$G" new "$RUNNER_TEMP/snow-racer"
          cd "$RUNNER_TEMP/snow-racer"
          git init -q
          "$G" use skier
          "$G" add system wind
          "$G" add lab wind-sweep --kind=sim
          "$G" add lab wind-hold --kind=scenario
          "$G" add lab wind-look --kind=picture
          "$G" add lab wind-cost --kind=bench
          "$G" add test wind
          git add -A
          "$G" check --engine="$GITHUB_WORKSPACE"
          # Played: the pilot's runs, each replayed to its digest, the protocol scripted, a state
          # read, and a log changed at one line found where it parts.
          E=--engine="$GITHUB_WORKSPACE"
          "$G" sim --seeds=1,2 "$E"
          "$G" replay runs/snow_racer-1.inputs "$E"
          printf '{"op":"observe"}\n{"op":"act","input":{"steer":1},"steps":60}\n{"op":"end"}\n' | "$G" play --seed=1 "$E" | grep -q '"op":"end"'
          "$G" state runs/snow_racer-1.inputs --step=60 "$E"
          sed -e '/^digest/d' -e '9s/.*/1 1/' runs/snow_racer-1.inputs > runs/edited.inputs
          "$G" diverge runs/snow_racer-1.inputs runs/edited.inputs "$E" --json | grep -q '"same":false'

