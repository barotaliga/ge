name: ghcr

# Mirrors one GitHub Release to GitHub Packages as an OCI artifact
# (ghcr.io/<owner>/gameengine2:X.Y.Z, and :latest when asked). The release's
# own files are the source: every archive and SHA256SUMS, downloaded from the
# release, pushed unchanged. Called by release.yml after it publishes, and
# dispatchable by hand or by an agent with a tag (`tag: v0.1.0`) to mirror a
# release again: a push to an existing tag overwrites it.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      latest:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to mirror, e.g. v0.1.0"
        required: true
        type: string
      latest:
        description: "Also move :latest to it"
        required: true
        type: boolean
        default: true

permissions: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag }}
      LATEST: ${{ inputs.latest }}
    steps:
      - name: Download the release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          (cd dist && sha256sum --check SHA256SUMS)

      - uses: oras-project/setup-oras@v2

      - name: Push to ghcr.io
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          REF="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd dist
          # One `file:mediatype` argument per file: a shell glob does not
          # expand inside a word that carries the `:mediatype` suffix.
          files=()
          for f in *.tar.gz; do files+=("$f:application/gzip"); done
          files+=("SHA256SUMS:text/plain")
          oras push "$REF:$VERSION" \
            --artifact-type application/vnd.gameengine2.release.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.description=gameengine2 $TAG: CMake packages per platform, source, SHA256SUMS" \
            "${files[@]}"
          if [ "$LATEST" = "true" ]; then oras tag "$REF:$VERSION" latest; fi
          echo "Published $REF:$VERSION (${#files[@]} files)" >> "$GITHUB_STEP_SUMMARY"
