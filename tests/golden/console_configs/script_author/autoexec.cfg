// scripts that compute: expressions, a guarded optional file, a loop that would never end
set rounds 0
alias count "inc rounds; if ($rounds < 3) then count"
set_eval half %sensitivity / 2
if_exists cvar optional_loaded "echo optional ran" "exec optional.cfg"
alias pick "if ('$1' =~ '^(rl|rocket)$') then impulse 7 else if ('$1' == 'lg') then impulse 8 else echo no weapon $1"
alias forever "forever"
