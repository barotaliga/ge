// saved last session
sensitivity "2.25"
volume "0.4"
seta hud_frags_x "-8"
seta hud_frags_y "4"
seta hud_frags_scale "1.5"
seta hud_clock_show "1"
seta hud_clock_align "top right"
seta hud_ammo_colour "255 200 0"
unaliasall
alias hud_minimal "hud_clock_show 0; hud_frags_scale 1"
alias hud_full "hud_clock_show 1; hud_frags_scale 1.5"
unbindall
bind f5 "cycle hud_frags_scale 1 1.25 1.5 2"
bind f6 "toggle hud_clock_show"
bind f7 hud_minimal
