name "captain"
team blue
// reports
alias report "if $health < 50 then say_team low $health/$armor at $location else say_team ok $health/$armor at $location"
alias need "if ($health < 50 or $armor < 50) then say_team need health and armor else say_team all fine"
bind r report
bind n need
// the powerups: a sound and a note when the quad is up
alias got_quad "play items/damage; echo QUAD for us"
alias lost_quad "echo quad is over"
msg_trigger got_quad "picked up the quad"
msg_trigger lost_quad "quad wears off"
alias enemy_quad "say_team enemy quad! fall back"
msg_trigger enemy_quad "enemy has the quad"
