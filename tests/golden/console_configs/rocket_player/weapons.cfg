// rocket jump: switch to the launcher, look down, jump and fire in one press
alias +rj "impulse 7; +jump; +attack"
alias -rj "-attack; -jump; weapon_last"
set w_last 1
alias weapon_last "impulse $w_last"

// the weapon wheel: 1..8, wrapping
seta w_cur 1
alias weapon_next "inc w_cur; if $w_cur > 8 then set w_cur 1; impulse $w_cur"
alias weapon_prev "dec w_cur; if $w_cur < 1 then set w_cur 8; impulse $w_cur"

// zoom: keep the sensitivity, halve it while zoomed
alias +zoom "set z_sens $sensitivity; set_calc sensitivity $sensitivity / 2; fov 40"
alias -zoom "sensitivity $z_sens; fov 105"

sensitivity 4.5
fov 105
crosshair 3
