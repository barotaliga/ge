// an old config: no `then`, upper case keys, everything on one line
alias +mlookjump "+mlook; +jump" ; alias -mlookjump "-jump"
bind ENTER +mlookjump
bind ESCAPE togglemenu
bind ~ toggleconsole
bind PGDN "impulse 10"
bind DEL "volume 0"
bind INS "volume 0.7"
bind ALT "+use"
set loud 1
alias louder "if $loud = 1 volume 1 else volume 0.5; toggle loud"
bind F12 louder
bind KP_UPARROW +forward
bind KP_DOWNARROW +back
m_pitch -0.022  // inverted mouse
cl_rollangle 0
r_drawviewmodel 0
