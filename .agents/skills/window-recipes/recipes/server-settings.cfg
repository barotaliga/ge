// SERVER SETTINGS read off a joined server, touching nothing (window-recipes skill).
// Set before it: recipe_server (host:port), recipe_out (the name of the pictures and the dump).
sleep 3
connect $recipe_server
sleep 12
menu_options
sleep 1
menu_select server
sleep 4
menu_list
screenshot $recipe_out
sleep 1
condump $recipe_out
sleep 1
disconnect
quit
